name: Validar responsive Flor Mía

on:
  push:
    branches: [codex/mejoras-responsive-mobile]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Generar build de producción
        run: npm run build

      - name: Verificar carpeta dist
        run: test -d dist && test -f dist/index.html
